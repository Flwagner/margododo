<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="Bruit blanc de sèche-cheveux pour aider bébé à s'endormir. Durée réglable, baisse progressive du volume.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>margododo — bruit blanc pour bébé</title>
<style>
  :root{
    --bg:#0a0e1a;
    --panel:#141a2e;
    --text:#e8ecf7;
    --muted:#8b93a8;
    --accent:#ffb454;
    --accent-soft:rgba(255,180,84,.16);
    --radius:16px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #1a2340 0%, var(--bg) 55%);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;
    justify-content:center;
  }
  main{
    width:100%;
    max-width:480px;
    min-height:100dvh;
    padding:calc(16px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  header{ text-align:center; margin-top:8px; }
  h1{ font-size:1.6rem; font-weight:700; letter-spacing:.02em; }
  h1 span{ color:var(--accent); }
  .subtitle{ color:var(--muted); font-size:.9rem; margin-top:6px; }
  #timeDisplay{
    font-variant-numeric:tabular-nums;
    font-size:clamp(3rem,16vw,4.5rem);
    font-weight:700;
    letter-spacing:.05em;
    color:var(--accent);
    text-shadow:0 0 30px rgba(255,180,84,.25);
  }
  #status{ color:var(--muted); font-size:.85rem; min-height:1.2em; }
  .play-btn{
    width:112px; height:112px; border-radius:50%;
    border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ffd08a, var(--accent) 45%, #e8912e 100%);
    color:#241303; font-size:2.4rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 30px rgba(255,180,84,.35), inset 0 -4px 12px rgba(0,0,0,.15);
    transition:transform .12s ease, box-shadow .2s ease;
    touch-action:manipulation;
  }
  .play-btn:active{ transform:scale(.94); }
  .ring-wrap{ position:relative; width:148px; height:148px; }
  .ring-wrap .play-btn{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
  }
  .ring-wrap .play-btn:active{ transform:translate(-50%,-50%) scale(.94); }
  .ring{ width:100%; height:100%; }
  .ring-bg{ fill:none; stroke:rgba(255,255,255,.08); stroke-width:3; }
  .ring-fg{
    fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round;
    stroke-dasharray:289.03; stroke-dashoffset:0; transition:stroke-dashoffset .3s linear;
  }
  #updateBanner{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:var(--panel); border-bottom:1px solid rgba(255,255,255,.1);
    font-size:.85rem;
  }
  #updateBanner[hidden]{ display:none; }
  #updateBtn{
    flex-shrink:0; border:none; border-radius:999px; cursor:pointer;
    background:var(--accent); color:#241303; font-weight:700; font-size:.85rem;
    padding:10px 16px; min-height:44px; touch-action:manipulation;
  }
  .controls{
    width:100%;
    background:var(--panel);
    border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius);
    padding:20px 18px;
    display:flex; flex-direction:column; gap:20px;
  }
  .ctl-row{ display:flex; flex-direction:column; gap:10px; }
  .ctl-label{ font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .pill-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .pill{
    flex:1 1 15%;
    min-width:56px; min-height:44px;
    border:1px solid rgba(255,255,255,.12);
    background:transparent; color:var(--text);
    border-radius:999px; font-size:.95rem; font-weight:600;
    cursor:pointer; touch-action:manipulation;
    transition:background .15s, border-color .15s, color .15s;
  }
  .pill.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .pill.infinite{ font-weight:800; }
  input[type=range]{
    width:100%; height:40px;
    accent-color:var(--accent);
    cursor:pointer; touch-action:manipulation;
  }
  .slider-meta{ display:flex; justify-content:space-between; align-items:center; gap:14px; font-size:.85rem; color:var(--muted); }
  .slider-meta input{ flex:1; min-width:0; }
  .slider-meta .value{ color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .curve{ width:100%; height:36px; display:block; }
  .curve-wrap{ position:relative; }
  .curve-marker{
    position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg);
    transform:translate(-50%,-50%); pointer-events:none;
    box-shadow:0 0 6px rgba(255,180,84,.6);
    transition:left .25s linear, top .25s linear;
  }
  .foot{ text-align:center; color:var(--muted); font-size:.7rem; margin-top:auto; opacity:.7; }
</style>
</head>
<body>
  <div id="updateBanner" hidden role="status">
    <span>Nouvelle version disponible</span>
    <button id="updateBtn">Recharger</button>
  </div>
<main>
  <header>
    <h1>margo<span>dodo</span></h1>
    <p class="subtitle">Bruit blanc de sèche-cheveux pour endormir bébé</p>
  </header>

  <div id="timeDisplay">30:00</div>
  <div id="status">Prêt</div>

  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring-bg" cx="50" cy="50" r="46"></circle>
      <path class="ring-fg" id="ringFg" d="M 50 4 A 46 46 0 0 0 50 96 A 46 46 0 0 0 50 4"></path>
    </svg>
    <button id="playBtn" class="play-btn" aria-label="Lancer la lecture">
      <span id="playIcon">▶</span>
    </button>
  </div>

  <section class="controls">
    <div class="ctl-row">
      <span class="ctl-label">Durée</span>
      <div class="pill-group" id="presetGroup">
        <button class="pill" data-min="5">5</button>
        <button class="pill" data-min="10">10</button>
        <button class="pill active" data-min="30">30</button>
        <button class="pill" data-min="60">60</button>
        <button class="pill infinite" data-inf="1">∞</button>
      </div>
      <div class="slider-meta">
        <input type="range" id="durationSlider" min="1" max="120" value="30" aria-label="Durée en minutes">
        <span class="value" id="durationValue">30 min</span>
      </div>
    </div>

    <div class="ctl-row">
      <span class="ctl-label">Évolution du volume</span>
      <div class="curve-wrap">
        <svg id="curveSvg" class="curve" viewBox="0 0 200 48" preserveAspectRatio="none" aria-hidden="true">
          <path id="curvePath" fill="none" stroke="#ffb454" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <div id="curveMarker" class="curve-marker" hidden></div>
      </div>
    </div>

    <div class="ctl-row">
      <span class="ctl-label">Volume</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="60" aria-label="Volume">
    </div>
  </section>

  <p class="foot">Écran maintenu allumé pendant la lecture</p>
</main>

<script>
"use strict";
(function(){
  const timeDisplay=document.getElementById('timeDisplay');
  const statusEl=document.getElementById('status');
  const playBtn=document.getElementById('playBtn');
  const playIcon=document.getElementById('playIcon');
  const ringFg=document.getElementById('ringFg');
  const curvePath=document.getElementById('curvePath');
  const curveMarker=document.getElementById('curveMarker');
  const updateBanner=document.getElementById('updateBanner');
  const updateBtn=document.getElementById('updateBtn');
  const presetGroup=document.getElementById('presetGroup');
  const durationSlider=document.getElementById('durationSlider');
  const durationValue=document.getElementById('durationValue');
  const volumeSlider=document.getElementById('volumeSlider');

  let ctx=null;
  let noiseSource=null;
  let humOsc=null;
  let hum2Osc=null;
  let envelope=null;
  let masterVolume=null;
  let noiseBuffer=null;

  let isPlaying=false;
  let infiniteMode=false;
  let durationMs=30*60*1000;
  let volume=0.6;
  let endTime=0;
  let tickInterval=null;
  let wakeLock=null;
  let swReg=null;
  let lastNotifBody=null;
  let mediaSessionReady=false;
  let pendingWorker=null;
  let reloadPending=false;
  let lastBadgeMins=-1;

  const RING_C=2*Math.PI*46;

  const CURVE_W=200, CURVE_H=48, CURVE_PAD=3;

  function fmt(ms){
    const total=Math.max(0,Math.ceil(ms/1000));
    const h=Math.floor(total/3600);
    const m=Math.floor((total%3600)/60);
    const s=total%60;
    const mm=String(m).padStart(2,'0');
    const ss=String(s).padStart(2,'0');
    return h>0 ? h+':'+mm+':'+ss : mm+':'+ss;
  }

  function createNoiseBuffer(ac){
    const len=Math.floor(ac.sampleRate*2);
    const buffer=ac.createBuffer(2,len,ac.sampleRate);
    for(let ch=0;ch<2;ch++){
      const data=buffer.getChannelData(ch);
      for(let i=0;i<len;i++){ data[i]=Math.random()*2-1; }
    }
    return buffer;
  }

  function buildGraph(){
    if(noiseSource) return;
    noiseBuffer=createNoiseBuffer(ctx);

    noiseSource=ctx.createBufferSource();
    noiseSource.buffer=noiseBuffer;
    noiseSource.loop=true;

    const highpass=ctx.createBiquadFilter();
    highpass.type='highpass'; highpass.frequency.value=80; highpass.Q.value=0.6;
    const lowpass=ctx.createBiquadFilter();
    lowpass.type='lowpass'; lowpass.frequency.value=3200; lowpass.Q.value=0.5;
    const peaking=ctx.createBiquadFilter();
    peaking.type='peaking'; peaking.frequency.value=1100; peaking.gain.value=4; peaking.Q.value=0.7;

    humOsc=ctx.createOscillator();
    humOsc.type='sine'; humOsc.frequency.value=100;
    const humGain=ctx.createGain(); humGain.gain.value=0.03;
    hum2Osc=ctx.createOscillator();
    hum2Osc.type='sine'; hum2Osc.frequency.value=200;
    const hum2Gain=ctx.createGain(); hum2Gain.gain.value=0.012;

    envelope=ctx.createGain();
    envelope.gain.value=0;
    masterVolume=ctx.createGain();
    masterVolume.gain.value=volume;

    noiseSource.connect(highpass);
    highpass.connect(lowpass);
    lowpass.connect(peaking);
    peaking.connect(envelope);

    humOsc.connect(humGain);
    humGain.connect(envelope);
    hum2Osc.connect(hum2Gain);
    hum2Gain.connect(envelope);

    envelope.connect(masterVolume);
    masterVolume.connect(ctx.destination);

    noiseSource.start();
    humOsc.start();
    hum2Osc.start();
  }

  function scheduleEnvelope(){
    const now=ctx.currentTime;
    envelope.gain.cancelScheduledValues(now);
    const current=envelope.gain.value;
    envelope.gain.setValueAtTime(current,now);
    if(infiniteMode){
      envelope.gain.linearRampToValueAtTime(volume, now+1.2);
      return;
    }
    const dur=durationMs/1000;
    const fadeIn=Math.min(1.2,dur/3);
    envelope.gain.linearRampToValueAtTime(volume, now+fadeIn);
    const start=now+fadeIn;
    const remaining=dur-fadeIn;
    const n=128;
    const curve=new Float32Array(n);
    for(let i=0;i<n;i++){
      const t=i/(n-1);
      curve[i]=volume*(1-t*t);
    }
    envelope.gain.setValueCurveAtTime(curve,start,remaining);
  }

  async function startAudio(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC){ statusEl.textContent='Audio non supporté'; return; }
      ctx=new AC();
    }
    setupMediaSession();
    if(ctx.state==='suspended'){ ctx.resume(); }
    buildGraph();
    if(masterVolume){ masterVolume.gain.value=volume; }
    scheduleEnvelope();
    endTime=Date.now()+durationMs;
    isPlaying=true;
    startTicker();
    requestWakeLock();
    setPlaybackState('playing');
    await requestNotifPermission();
    showNotification(true);
    updateUI();
  }

  function stopAudio(){
    isPlaying=false;
    clearInterval(tickInterval);
    tickInterval=null;
    releaseWakeLock();
    updateBadge();
    setPlaybackState('none');
    closeNotification();
    lastNotifBody=null;
    if(ctx && noiseSource){
      const now=ctx.currentTime;
      try{
        envelope.gain.cancelScheduledValues(now);
        envelope.gain.setValueAtTime(envelope.gain.value,now);
        envelope.gain.linearRampToValueAtTime(0, now+0.2);
        noiseSource.stop(now+0.25);
      }catch(e){}
      setTimeout(teardown,350);
    }
    updateUI();
  }

  function teardown(){
    if(isPlaying) return;
    try{ if(humOsc){ humOsc.stop(); } }catch(e){}
    try{ if(hum2Osc){ hum2Osc.stop(); } }catch(e){}
    try{ if(noiseSource){ noiseSource.stop(); } }catch(e){}
    try{ if(masterVolume){ masterVolume.disconnect(); } }catch(e){}
    ctx.close().catch(function(){});
    ctx=null; noiseSource=null; humOsc=null; hum2Osc=null;
    envelope=null; masterVolume=null; noiseBuffer=null;
  }

  function startTicker(){
    clearInterval(tickInterval);
    tickInterval=setInterval(tick,250);
  }

  function tick(){
    if(!isPlaying) return;
    if(infiniteMode){
      timeDisplay.textContent='∞';
      updateRing();
      updateBadge();
      updateCurveMarker();
      updatePosition();
      showNotification();
      return;
    }
    const remaining=endTime-Date.now();
    if(remaining<=0){
      timeDisplay.textContent='00:00';
      stopAudio();
      return;
    }
    timeDisplay.textContent=fmt(remaining);
    updateRing();
    updateBadge();
    updateCurveMarker();
    updatePosition();
    showNotification();
  }

  function reschedule(){
    if(isPlaying){
      endTime=Date.now()+durationMs;
      if(ctx){ scheduleEnvelope(); }
    }
  }

  function updateDurationLabel(){
    if(infiniteMode){
      durationValue.textContent='∞';
      if(!isPlaying) timeDisplay.textContent='∞';
    }else{
      durationValue.textContent=Math.round(durationMs/60000)+' min';
      if(!isPlaying) timeDisplay.textContent=fmt(durationMs);
    }
  }

  function updatePresetActive(){
    const mins=Math.round(durationMs/60000);
    presetGroup.querySelectorAll('.pill').forEach(function(b){
      if(b.dataset.inf==='1'){
        b.classList.toggle('active',infiniteMode);
      }else{
        b.classList.toggle('active', !infiniteMode && parseInt(b.dataset.min,10)===mins);
      }
    });
  }

  function saveSettings(){
    try{
      localStorage.setItem('margododo.durationMin',String(Math.round(durationMs/60000)));
      localStorage.setItem('margododo.infinite',infiniteMode?'1':'0');
      localStorage.setItem('margododo.volume',String(Math.round(volume*100)));
    }catch(e){}
  }

  function loadSettings(){
    try{
      const d=parseInt(localStorage.getItem('margododo.durationMin'),10);
      if(!isNaN(d) && d>=1 && d<=120){
        durationMs=d*60*1000;
        durationSlider.value=d;
      }
      const inf=localStorage.getItem('margododo.infinite');
      if(inf==='1'){ infiniteMode=true; }
      const v=parseInt(localStorage.getItem('margododo.volume'),10);
      if(!isNaN(v)){
        volume=Math.max(0,Math.min(100,v))/100;
        volumeSlider.value=v;
      }
    }catch(e){}
  }

  function updateRing(){
    let frac=1;
    if(isPlaying && !infiniteMode){
      frac=Math.max(0,Math.min(1,(endTime-Date.now())/durationMs));
    }
    ringFg.style.strokeDashoffset=String(RING_C*(1-frac));
  }

  function updateBadge(){
    if(!('setAppBadge' in navigator)) return;
    try{
      if(!isPlaying || infiniteMode){
        if(lastBadgeMins!==0){ navigator.clearAppBadge(); lastBadgeMins=0; }
        return;
      }
      const mins=Math.max(1,Math.ceil(Math.max(0,endTime-Date.now())/60000));
      if(mins!==lastBadgeMins){
        navigator.setAppBadge(mins);
        lastBadgeMins=mins;
      }
    }catch(e){}
  }

  function drawCurve(){
    const pts=[];
    if(infiniteMode){
      pts.push([CURVE_PAD,CURVE_H-CURVE_PAD]);
      pts.push([CURVE_W-CURVE_PAD,CURVE_H-CURVE_PAD]);
    }else{
      const dur=durationMs/1000;
      const fadeIn=Math.min(1.2,dur/3);
      const tail=dur-fadeIn;
      const n=120;
      for(let i=0;i<n;i++){
        const t=(i/(n-1))*dur;
        let y;
        if(t<fadeIn){ y=volume*(t/fadeIn); }
        else{ const u=(t-fadeIn)/tail; y=volume*(1-u*u); }
        pts.push([CURVE_PAD+(CURVE_W-2*CURVE_PAD)*(t/dur), CURVE_H-CURVE_PAD-(CURVE_H-2*CURVE_PAD)*y]);
      }
    }
    const d=pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
    curvePath.setAttribute('d',d);
  }

  function curveValueAt(sec){
    const dur=durationMs/1000;
    const fadeIn=Math.min(1.2,dur/3);
    const tail=dur-fadeIn;
    if(sec<fadeIn){ return volume*(sec/fadeIn); }
    const u=(sec-fadeIn)/tail;
    return volume*(1-u*u);
  }

  function updateCurveMarker(){
    if(!isPlaying || infiniteMode){
      curveMarker.hidden=true;
      return;
    }
    const remaining=Math.max(0,endTime-Date.now());
    const tFrac=Math.max(0,Math.min(1,1-remaining/durationMs));
    const yval=curveValueAt(tFrac*durationMs/1000);
    const x=CURVE_PAD+(CURVE_W-2*CURVE_PAD)*tFrac;
    const y=CURVE_H-CURVE_PAD-(CURVE_H-2*CURVE_PAD)*yval;
    curveMarker.style.left=(x/CURVE_W*100)+'%';
    curveMarker.style.top=(y/CURVE_H*100)+'%';
    curveMarker.hidden=false;
  }

  function updateUI(){
    updateRing();
    updateCurveMarker();
    if(isPlaying){
      playBtn.setAttribute('aria-label','Arrêter la lecture');
      playIcon.textContent='■';
      statusEl.textContent=infiniteMode?'En lecture · illimité':'En lecture';
    }else{
      playBtn.setAttribute('aria-label','Lancer la lecture');
      playIcon.textContent='▶';
      statusEl.textContent='Prêt';
      updateDurationLabel();
    }
  }

  function requestWakeLock(){
    if('wakeLock' in navigator){
      navigator.wakeLock.request('screen').then(function(lock){
        wakeLock=lock;
      }).catch(function(){ wakeLock=null; });
    }
  }

  function releaseWakeLock(){
    if(wakeLock){
      try{ wakeLock.release(); }catch(e){}
      wakeLock=null;
    }
  }

  function setupMediaSession(){
    if(!('mediaSession' in navigator) || mediaSessionReady) return;
    mediaSessionReady=true;
    try{
      navigator.mediaSession.metadata=new MediaMetadata({
        title:'Bruit blanc',
        artist:'margododo',
        artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]
      });
      navigator.mediaSession.setActionHandler('play',function(){ startAudio(); });
      navigator.mediaSession.setActionHandler('pause',function(){ stopAudio(); });
      navigator.mediaSession.setActionHandler('stop',function(){ stopAudio(); });
    }catch(e){}
  }

  function setPlaybackState(state){
    if(!('mediaSession' in navigator)) return;
    try{ navigator.mediaSession.playbackState=state; }catch(e){}
  }

  function updatePosition(){
    if(!('mediaSession' in navigator) || !isPlaying || infiniteMode) return;
    try{
      const remaining=Math.max(0,endTime-Date.now());
      navigator.mediaSession.setPositionState({
        duration:durationMs/1000,
        position:Math.max(0,(durationMs-remaining)/1000),
        playbackRate:1
      });
    }catch(e){}
  }

  function registerSW(){
    if(!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      swReg=reg;
      reg.addEventListener('updatefound',function(){
        const w=reg.installing;
        if(!w) return;
        w.addEventListener('statechange',function(){
          if(w.state==='installed' && navigator.serviceWorker.controller){
            pendingWorker=w;
            updateBanner.hidden=false;
          }
        });
      });
    }).catch(function(){ swReg=null; });
  }

  async function requestNotifPermission(){
    if(!('Notification' in window)) return;
    if(Notification.permission==='default'){
      try{ await Notification.requestPermission(); }catch(e){}
    }
  }

  function notifPayload(){
    if(infiniteMode){
      return { title:'margododo · en lecture', body:'Lecture continue', label:'Arrêter' };
    }
    const rem=Math.max(0,endTime-Date.now());
    return { title:'margododo · en lecture', body:'Reste '+fmt(rem), label:'Arrêter' };
  }

  async function showNotification(force){
    if(!swReg || !('Notification' in window) || Notification.permission!=='granted') return;
    const p=notifPayload();
    if(!force && p.body===lastNotifBody) return;
    lastNotifBody=p.body;
    try{
      await swReg.showNotification(p.title,{
        tag:'margododo',
        body:p.body,
        icon:'icon.svg',
        badge:'icon.svg',
        actions:[{action:'stop',title:p.label}]
      });
    }catch(e){}
  }

  async function closeNotification(){
    if(!swReg) return;
    try{
      const list=await swReg.getNotifications({tag:'margododo'});
      list.forEach(function(n){ n.close(); });
    }catch(e){}
  }

  playBtn.addEventListener('click',function(){
    if(isPlaying){ stopAudio(); }else{ startAudio(); }
  });

  updateBtn.addEventListener('click',function(){
    updateBanner.hidden=true;
    if(pendingWorker){
      reloadPending=true;
      pendingWorker.postMessage({type:'SKIP_WAITING'});
    }else{
      window.location.reload();
    }
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message',function(e){
      if(e.data && e.data.type==='stop'){ stopAudio(); }
    });
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(reloadPending){ window.location.reload(); }
    });
  }

  presetGroup.addEventListener('click',function(e){
    const btn=e.target.closest('.pill');
    if(!btn) return;
    if(btn.dataset.inf==='1'){
      infiniteMode=true;
    }else{
      infiniteMode=false;
      durationMs=parseInt(btn.dataset.min,10)*60*1000;
      durationSlider.value=btn.dataset.min;
    }
    updatePresetActive();
    updateDurationLabel();
    saveSettings();
    drawCurve();
    if(isPlaying){ reschedule(); }
  });

  durationSlider.addEventListener('input',function(){
    infiniteMode=false;
    durationMs=parseInt(durationSlider.value,10)*60*1000;
    updatePresetActive();
    updateDurationLabel();
    saveSettings();
    drawCurve();
    if(isPlaying){ reschedule(); }
  });

  volumeSlider.addEventListener('input',function(){
    volume=volumeSlider.value/100;
    if(masterVolume && ctx){ masterVolume.gain.setValueAtTime(volume,ctx.currentTime); }
    saveSettings();
    drawCurve();
  });

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){
      if(isPlaying){ requestWakeLock(); showNotification(true); }
      if(swReg){ swReg.update().catch(function(){}); }
    }
  });

  registerSW();
  loadSettings();
  updatePresetActive();
  updateDurationLabel();
  drawCurve();
  updateRing();
})();
</script>
</body>
</html>
